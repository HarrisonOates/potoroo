[package]
name = "potoroo"
version = "0.1.0"
edition = "2021"
default-run = "potoroo"
description = "A modern partial-order causal-link (POCL) planner in Rust"
license = "Apache-2.0"

[[bin]]
name = "potoroo"
path = "src/bin/potoroo.rs"

[[bin]]
name = "potoroo-htn"
path = "src/bin/potoroo-htn.rs"
required-features = ["htn"]

[lib]
name = "potoroo"
path = "src/lib.rs"

[features]
default = []
# Grounded decomposition-based HTN search; the flat planner keeps its own types.
htn = []
# Solve the Lplan LP with HiGHS instead of the pure-Rust microlp. HiGHS is a C++
# library built from source, so this is off by default: the core stays buildable
# with no system dependencies.
highs-lp = ["good_lp/highs"]

[dependencies]
pddl = "0.2"
# Only for rendering `pddl`'s parse failures with a line and column: its
# errors are `nom` types, and `nom::error::Error`'s own `Display` prints an
# internal combinator name plus the whole unconsumed input. Must stay on the
# same major version as the one `pddl` uses, which a mismatch catches at
# compile time.
nom = "8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
# Pure-Rust LP modelling + solver (microlp backend) for the Lplan heuristic. No
# system libraries required, so the core stays buildable everywhere.
good_lp = { version = "1.13", default-features = false, features = ["microlp"] }

[dev-dependencies]
assert_cmd = "2"

# Link-time optimization for the release binary: a free constant-factor speedup
# on the search-heavy hot path, with no behavioural change.
[profile.release]
lto = true
codegen-units = 1

# Release codegen with symbols, for `perf`. `debug = 1` (line tables) does not
# change optimisation, so a profile taken here reflects release behaviour.
[profile.profiling]
inherits = "release"
debug = 1
