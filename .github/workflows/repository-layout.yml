name: Repository layout

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    name: Keep investigation files out of main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tracked files
        run: |
          if [ -n "$(git ls-files -- investigation/)" ]; then
            echo "::error::Keep investigation files on research branches, outside main."
            exit 1
          fi
